<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSI 控制台 — 采集 / 训练 / 实时检测</title>
<style>
  :root {
    --bg: #0f1420; --panel: #171e2e; --panel2: #1d2638; --line: #2a3550;
    --text: #dbe4f5; --dim: #8494b4; --accent: #4da3ff; --ok: #35c988;
    --warn: #ffb648; --bad: #ff5d6c; --motion: #ff5d6c; --idle: #35c988;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text);
         font: 14px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
           padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; font-weight: 600; margin-right: 8px; }
  input, select, button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 10px; font: inherit; }
  input:focus, select:focus { outline: 1px solid var(--accent); }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger  { background: var(--bad);   border-color: var(--bad);   color: #fff; }
  .chip { padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line);
          background: var(--panel2); font-size: 12px; color: var(--dim); white-space: nowrap; }
  .chip b { color: var(--text); font-weight: 600; }
  main { display: grid; grid-template-columns: 1fr 330px; gap: 12px; padding: 12px 16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
          padding: 12px; }
  .card h2 { font-size: 13px; color: var(--dim); font-weight: 600; margin-bottom: 8px;
             letter-spacing: .05em; }
  canvas { display: block; width: 100%; border-radius: 6px; background: #0b0f18; }
  #curve { height: 300px; }
  #waterfall { height: 160px; margin-top: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row + .row { margin-top: 8px; }
  label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--dim);
            flex: 1; min-width: 90px; }
  .bigstate { text-align: center; padding: 14px 0 10px; }
  .bigstate .st { font-size: 26px; font-weight: 700; letter-spacing: .08em; }
  .bigstate .sc { color: var(--dim); font-size: 13px; margin-top: 2px; }
  .bar { height: 8px; border-radius: 4px; background: var(--panel2); overflow: hidden; margin: 8px 0; }
  .bar > div { height: 100%; width: 0%; background: var(--idle); transition: width .3s; }
  #prog { display: none; }
  #prog .bar > div { background: var(--accent); }
  #log { height: 120px; overflow-y: auto; font: 12px/1.6 Consolas, monospace;
         color: var(--dim); white-space: pre-wrap; }
  .hint { color: var(--dim); font-size: 12px; margin-top: 8px; }
  ul.sessions { list-style: none; max-height: 130px; overflow-y: auto; font-size: 12px; }
  ul.sessions li { padding: 3px 6px; border-radius: 4px; display: flex; justify-content: space-between; }
  ul.sessions li:nth-child(odd) { background: var(--panel2); }
  ul.sessions .lb { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Wi-Fi CSI 控制台</h1>
  <input id="host" placeholder="设备IP, 如 192.168.1.50" style="width:180px">
  <button id="btnConnect" class="primary">连接设备</button>
  <span class="chip">pps <b id="pps">–</b></span>
  <span class="chip">数据包 <b id="pkts">–</b></span>
  <span class="chip">断流 <b id="gaps">–</b></span>
  <span class="chip" id="modeChip">未连接</span>
</header>

<main>
  <section>
    <div class="card">
      <h2>原始子载波幅度（自动挑波动最大的 8 个）</h2>
      <canvas id="curve"></canvas>
      <h2 style="margin-top:12px">瀑布图（亮 = 该子载波正在变化）</h2>
      <canvas id="waterfall"></canvas>
      <p class="hint" id="streamHint">提示：采集或检测运行时 CSI 流被独占，实时曲线会暂停。</p>
    </div>
  </section>

  <section style="display:flex; flex-direction:column; gap:12px">
    <div class="card">
      <h2>① 采集带标签数据</h2>
      <div class="row">
        <label class="f">动作标签
          <input id="recLabel" list="labels" value="empty">
          <datalist id="labels">
            <option value="empty"><option value="static"><option value="walk">
            <option value="typing"><option value="page_turning">
            <option value="fan"><option value="robot_vacuum">
          </datalist>
        </label>
        <label class="f">时长(秒)<input id="recDur" type="number" value="30" min="5"></label>
        <label class="f">描述<input id="recDesc" placeholder="位置/距离/朝向"></label>
      </div>
      <div class="row">
        <button id="btnRec" class="primary" style="flex:1">开始采集</button>
        <button id="btnRecStop" class="danger" disabled>停止</button>
      </div>
      <div id="prog"><div class="bar"><div id="progBar"></div></div>
        <p class="hint" id="progText"></p></div>
      <h2 style="margin-top:10px">已采集会话</h2>
      <ul class="sessions" id="sessions"></ul>
    </div>

    <div class="card">
      <h2>② 实时检测（有移动 / 无移动）</h2>
      <div class="row">
        <label class="f">模型<select id="detModel"></select></label>
        <label class="f">阈值(0~1)<input id="detThr" type="number" value="0.5"
              step="0.05" min="0.05" max="0.95"></label>
      </div>
      <div class="row">
        <button id="btnDet" class="primary" style="flex:1">开始检测</button>
        <button id="btnDetStop" class="danger" disabled>停止</button>
      </div>
      <div class="bigstate">
        <div class="st" id="detState">— 未运行 —</div>
        <div class="sc" id="detScore">启动检测后这里显示实时判断</div>
      </div>
      <div class="bar"><div id="detBar"></div></div>
      <canvas id="spark" style="height:60px"></canvas>
    </div>

    <div class="card" style="flex:1">
      <h2>③ 训练模型（训练仍在命令行跑，结果在这里可见）</h2>
      <div class="row"><button id="btnRefresh" style="flex:1">刷新模型/会话列表</button></div>
      <p class="hint">训练命令: <code>python scripts/train.py --data data</code><br>
      新模型训练完成后点刷新即可在下拉框看到。</p>
    </div>

    <div class="card" style="flex:1">
      <h2>事件日志</h2>
      <div id="log"></div>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let buffer = [];            // [{t, a:[64]}]
let wfCols = [];            // 瀑布图列
let detScores = [];
let autoSC = null, lastPick = 0, lastY = null, lastYt = 0;

function log(msg) {
  const el = $("log");
  el.textContent += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
  el.scrollTop = el.scrollHeight;
}
async function api(path, body) {
  const r = await fetch(path, body ? {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body)} : {});
  const j = await r.json();
  if (!j.ok) { log("❌ " + (j.error || path)); alert(j.error || "请求失败"); }
  return j;
}

/* ---------- SSE 实时流 ---------- */
let es = null;
function openStream() {
  if (es) es.close();
  es = new EventSource("/api/stream");
  es.addEventListener("batch", e => {
    const d = JSON.parse(e.data);
    for (const p of d) { buffer.push(p); }
    const cutoff = buffer.length ? buffer[buffer.length-1].t - 10 : 0;
    while (buffer.length && buffer[0].t < cutoff) buffer.shift();
    for (const p of d) {
      wfCols.push(p.a.map(v => v));
      if (wfCols.length > 200) wfCols.shift();
    }
  });
  es.addEventListener("note", e => {
    $("streamHint").textContent = "⏸ " + JSON.parse(e.data).msg;
  });
  es.onerror = () => { $("modeChip").textContent = "流已断开"; };
}

/* ---------- 画布 ---------- */
function fit(cv) {
  const r = devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== w*r) { cv.width = w*r; cv.height = h*r; }
  const ctx = cv.getContext("2d");
  ctx.setTransform(r, 0, 0, r, 0, 0);
  return [ctx, w, h];
}
const COLORS = ["#4da3ff","#35c988","#ffb648","#ff5d6c","#b78bff","#4dd7e8",
                "#ff9d5c","#9dd65c"];
function drawCurve() {
  const [ctx, W, H] = fit($("curve"));
  ctx.clearRect(0, 0, W, H);
  if (buffer.length < 2) {
    ctx.fillStyle = "#8494b4"; ctx.font = "13px sans-serif";
    ctx.fillText(buffer.length ? "接收数据中…" : "连接设备后开始显示", 14, 26);
    return;
  }
  const t1 = buffer[buffer.length-1].t, t0 = t1 - 10;
  const win = buffer.filter(p => p.t >= t0);
  // 每 2 秒重选 8 个波动最大的子载波
  if (!autoSC || performance.now() - lastPick > 2000) {
    lastPick = performance.now();
    const n = win[0].a.length, varr = new Array(n).fill(0);
    const mean = new Array(n).fill(0);
    for (const p of win) for (let i = 0; i < n; i++) { varr[i] += p.a[i]*p.a[i]; mean[i] += p.a[i]; }
    for (let i = 0; i < n; i++) mean[i] /= win.length;
    for (let i = 0; i < n; i++) varr[i] = Math.max(0, varr[i]/win.length - mean[i]**2);
    autoSC = varr.map((v,i)=>[v,i]).sort((a,b)=>b[0]-a[0]).slice(0,8).map(x=>x[1]);
  }
  // Y 范围每 2 秒固定一次
  if (!lastY || performance.now() - lastYt > 2000) {
    lastYt = performance.now();
    let lo = 1e9, hi = -1e9;
    for (const p of win) for (const i of autoSC) { lo = Math.min(lo,p.a[i]); hi = Math.max(hi,p.a[i]); }
    const pad = Math.max(2, (hi-lo)*0.15);
    lastY = [lo-pad, hi+pad];
  }
  const [y0, y1] = lastY, n = win[0].a.length;
  ctx.strokeStyle = "#2a3550"; ctx.lineWidth = .5;
  for (let g = 1; g < 4; g++) { ctx.beginPath(); ctx.moveTo(0, H*g/4); ctx.lineTo(W, H*g/4); ctx.stroke(); }
  autoSC.forEach((sc, k) => {
    ctx.strokeStyle = COLORS[k]; ctx.lineWidth = 1.2; ctx.beginPath();
    win.forEach((p, j) => {
      const x = (p.t - t0) / (t1 - t0) * W;
      const y = H - (p.a[sc] - y0) / (y1 - y0) * H;
      j ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    });
    ctx.stroke();
  });
  ctx.fillStyle = "#8494b4"; ctx.font = "11px sans-serif";
  ctx.fillText(`子载波 ${autoSC.join(", ")} | Y轴 ${y0.toFixed(0)}~${y1.toFixed(0)} | 最近10秒`, 8, 14);
}
function drawWF() {
  const [ctx, W, H] = fit($("waterfall"));
  ctx.clearRect(0, 0, W, H);
  const cols = wfCols, rows = cols.length ? cols[0].length : 64;
  cols.forEach((col, x) => {
    const mean = col.reduce((a,b)=>a+b,0) / rows;
    col.forEach((v, y) => {
      const dev = Math.max(-1, Math.min(1, (v - mean) / (mean * 0.06)));
      const a = Math.abs(dev);
      ctx.fillStyle = dev > 0
        ? `rgba(77,163,255,${a*0.9})` : `rgba(255,93,108,${a*0.9})`;
      const hh = H / rows;
      ctx.fillRect(x / cols.length * W, H - (y+1) * hh, W / cols.length + 1, hh);
    });
  });
  ctx.fillStyle = "#8494b4"; ctx.font = "11px sans-serif";
  ctx.fillText(cols.length ? "" : "等待数据…", 8, 14);
}
function drawSpark() {
  const [ctx, W, H] = fit($("spark"));
  ctx.clearRect(0, 0, W, H);
  const s = detScores.slice(-60);
  if (s.length < 2) return;
  ctx.strokeStyle = "#4da3ff"; ctx.lineWidth = 1.5; ctx.beginPath();
  s.forEach((v, i) => {
    const x = i / (s.length-1) * W, y = H - v * H;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  });
  ctx.stroke();
  ctx.strokeStyle = "#ffb648"; ctx.setLineDash([4,4]);
  const ty = H - (parseFloat($("detThr").value)||0.5) * H;
  ctx.beginPath(); ctx.moveTo(0,ty); ctx.lineTo(W,ty); ctx.stroke(); ctx.setLineDash([]);
}
(function loop(){ drawCurve(); drawWF(); drawSpark(); requestAnimationFrame(loop); })();

/* ---------- 状态轮询 ---------- */
let polling = null;
async function poll() {
  const j = await api("/api/status").catch(()=>null);
  if (!j) return;
  // 事件日志（按 id 去重）
  for (const e of (j.events || [])) {
    if (e.id > (poll._eid || 0)) { poll._eid = e.id; log(`[${e.time}] ${e.msg}`); }
  }
  $("pps").textContent = j.stream.pps ?? "–";
  $("pkts").textContent = j.stream.packets ?? "–";
  $("gaps").textContent = j.stream.gaps ?? "–";
  $("modeChip").textContent =
    j.recording.active ? `采集中: ${j.recording.label}` :
    j.detector.active  ? "检测运行中" :
    j.connected ? "实时曲线" : "未连接";
  // 采集进度
  if (j.recording.active) {
    $("prog").style.display = "block";
    const pct = Math.min(100, j.recording.elapsed / j.recording.duration * 100);
    $("progBar").style.width = pct + "%";
    $("progText").textContent =
      `${j.recording.label} | ${j.recording.elapsed.toFixed(0)}/${j.recording.duration}s | ${j.recording.packets} 包`;
  } else { $("prog").style.display = "none"; }
  // 检测状态
  if (j.detector.active && j.detector.last) {
    const r = j.detector.last, motion = r.state === "motion";
    $("detState").textContent = motion ? "● 有人移动" : "○ 无移动";
    $("detState").style.color = motion ? "var(--motion)" : "var(--idle)";
    $("detScore").textContent = `score ${r.score.toFixed(2)} | pps ${r.pps} | 断流 ${r.stream_gaps}`;
    const bar = $("detBar");
    bar.style.width = (r.score * 100) + "%";
    bar.style.background = motion ? "var(--motion)" : "var(--idle)";
    if (detScores.length === 0 || detScores[detScores.length-1] !== r.score)
      detScores.push(r.score);
    if (detScores.length > 120) detScores.shift();
  } else if (j.detector.active && !j.detector.last) {
    $("detState").textContent = "… 启动中，等第一个窗口 …"; $("detState").style.color = "var(--warn)";
  } else if (!j.detector.active) {
    $("detState").textContent = "— 未运行 —"; $("detState").style.color = "var(--dim)";
  }
  // 会话与模型列表
  if (j.sessions_sig !== poll._ssig) {
    poll._ssig = j.sessions_sig;
    $("sessions").innerHTML = j.sessions.map(s =>
      `<li><span class="lb">${s.label}</span><span>${s.name} · ${s.packets}包</span></li>`).join("");
    const sel = $("detModel"), cur = sel.value;
    sel.innerHTML = j.models.map(m => `<option>${m}</option>`).join("") ||
                    "<option disabled>（还没有模型）</option>";
    if ([...sel.options].some(o => o.value === cur)) sel.value = cur;
  }
}

/* ---------- 按钮事件 ---------- */
$("btnConnect").onclick = async () => {
  const host = $("host").value.trim();
  if (!host) return alert("先填设备 IP");
  const j = await api("/api/connect", {host});
  if (j.ok) { log(`✔ 已连接 ${host} (${j.chip || "设备"})`); openStream(); }
};
$("btnRec").onclick = async () => {
  const j = await api("/api/record/start", {
    label: $("recLabel").value.trim() || "unlabeled",
    duration: +$("recDur").value || 30,
    description: $("recDesc").value.trim(),
  });
  if (j.ok) { log(`▶ 开始采集 ${$("recLabel").value} ${$("recDur").value}s`); $("btnRec").disabled = true; }
};
$("btnRecStop").onclick = async () => {
  const j = await api("/api/record/stop");
  if (j.ok) log("■ 采集已停止");
};
$("btnDet").onclick = async () => {
  if (!$("detModel").value || $("detModel").value.includes("还没有")) return alert("先训练一个模型");
  const j = await api("/api/detect/start", {
    model: $("detModel").value, threshold: +$("detThr").value || 0.5 });
  if (j.ok) { log("▶ 开始实时检测"); $("btnDet").disabled = true; detScores = []; }
};
$("btnDetStop").onclick = async () => { await api("/api/detect/stop"); log("■ 检测已停止"); };
$("btnRefresh").onclick = () => poll();

setInterval(poll, 700);
log("控制台已就绪。填入设备 IP 并点击「连接设备」。");
poll();
</script>
</body>
</html>
